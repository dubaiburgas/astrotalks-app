<!DOCTYPE html>
<html>
<head>
  <title>Birth Chart Calculator</title>
  <style>
    body {
      background-color: #F0E4C2;
      color: #2F2B36;
      font-family: 'Wix Madefor Display', sans-serif;
    }
    .planet {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Birth Chart Calculator</h1>
  <form method="POST">
    Name: <input type="text" name="name"><br>
    Date (YYYY-MM-DD): <input type="text" name="date"><br>
    Time (HH:MM): <input type="text" name="time"><br>
    Latitude: <input type="text" name="lat"><br>
    Longitude: <input type="text" name="lon"><br>
    <input type="submit" value="Generate Chart">
  </form>

  {% if chart %}
    <h2>Chart Results</h2>
    <ul>
      {% for obj, sign, lon in chart %}
        <li class="planet">{{ obj }} – {{ sign }} {{ "%.0f"|format(lon) }}° {{ "%02d"|format((lon % 1 * 60)) }}′</li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
